name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - name: Lint
        run: make lint
      - name: Simulate
        run: make test
      - name: Synthesis check
        run: make synth
      - name: Mutation test
        run: make mutation
